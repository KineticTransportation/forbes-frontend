# Pings IndexNow (Bing, and every engine that shares the protocol) after each
# push to main so new/updated URLs get recrawled quickly. Best effort by
# design: the key is public by protocol (it must be readable at the
# keyLocation URL anyway), and API hiccups must never fail CI, so every path
# through this job exits 0.
name: IndexNow

on:
  push:
    branches: [main]

# Read-only access to deployment statuses, so the job can wait for Vercel.
permissions:
  deployments: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # app/sitemap.js is dependency-free, so the URL list comes straight from
      # the same source of truth the live sitemap.xml is generated from.
      - name: Build payload from app/sitemap.js
        run: |
          node --input-type=module -e '
            const { default: sitemap } = await import(new URL("./app/sitemap.js", `file://${process.cwd()}/`));
            const fs = await import("node:fs");
            const payload = {
              host: "www.forbeslogistix.com",
              key: "48b5bea329bdc10aff8cca4b9dad2d4b",
              keyLocation: "https://www.forbeslogistix.com/48b5bea329bdc10aff8cca4b9dad2d4b.txt",
              urlList: sitemap().map((entry) => entry.url),
            };
            fs.writeFileSync("indexnow-payload.json", JSON.stringify(payload));
            console.log(JSON.stringify(payload, null, 2));
          '

      # Wait for Vercel's Production deployment of THIS commit to report
      # success before pinging, so engines recrawl the new pages rather than
      # the old ones. (The earlier key-file check passed instantly after the
      # first deploy, so pings could beat the build.) Bounded at ~10 minutes
      # and never fails the build: on timeout or a failed deploy it submits
      # anyway, which is harmless.
      - name: Wait for the production deploy of this commit (bounded, never fails the build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=Production" --jq '.[0].id // empty' 2>/dev/null) || id=""
            if [ -n "${id}" ]; then
              state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '.[0].state // empty' 2>/dev/null) || state=""
              echo "Check ${i}: deployment ${id} state=${state:-pending}"
              case "${state}" in
                success) echo "Production deploy is live."; exit 0 ;;
                failure|error) echo "Production deploy did not succeed; submitting anyway."; exit 0 ;;
              esac
            else
              echo "Check ${i}: no Production deployment for ${GITHUB_SHA} yet"
            fi
            sleep 15
          done
          echo "Timed out waiting for the deploy; submitting anyway."
          exit 0

      - name: Submit to IndexNow (best effort, never fails the build)
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              -H "Content-Type: application/json; charset=utf-8" \
              --data @indexnow-payload.json \
              https://api.indexnow.org/indexnow) || code="curl-error"
            echo "Attempt ${attempt}: HTTP ${code}"
            case "${code}" in
              200|202) exit 0 ;;
            esac
            [ "${attempt}" -lt 3 ] && sleep 15
          done
          echo "IndexNow did not accept the submission; continuing without failing CI."
          exit 0
